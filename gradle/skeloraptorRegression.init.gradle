allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir('src/test/skeloraptor/java')
        sourceSets.main.resources.srcDir('src/test/skeloraptor/resources')
        sourceSets.main.resources.srcDir('src/test/performance/resources')
        repositories { flatDir { dirs project.file('build/legendary-duel-input') } }
        dependencies { implementation fg.deobf('testlocal:legendarymonsters:2.2.2') }
        minecraft.runs { gameTestServer {
            workingDirectory project.file('build/skeloraptor-gametest')
            property 'forge.enabledGameTestNamespaces', 'domesticationinnovation'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            arg '-mixin.config=citadel.mixins.json'
            arg '-mixin.config=domesticationinnovation.mixins.json'
            mods { domesticationinnovation { source sourceSets.main } }
        } }
    }
}
