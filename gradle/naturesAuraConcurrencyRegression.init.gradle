allprojects { afterEvaluate {
    repositories.flatDir { dirs project.file('build/naturesaura'),'C:/Users/bruns/Downloads/serverpack-slim-6.6.5b3hf/mods' }
    ['NaturesAura-39.4-throttled-chunk-threadsafe','Patchouli-1.20.1-85-FORGE'].each {
        dependencies.add('implementation',fg.deobf("aura-concurrency-test:${it}:v1"))
    }
    sourceSets.main.java.srcDir('src/test/auraconcurrency/java')
    sourceSets.main.resources.srcDir('src/test/performance/resources')
    minecraft.runs { gameTestServer {
        workingDirectory project.file('build/aura-concurrency-gametest')
        property 'forge.enabledGameTestNamespaces','domesticationinnovation'
        property 'mixin.env.remapRefMap','true'
        property 'mixin.env.refMapRemappingFile',"${project.projectDir}/build/createSrgToMcp/output.srg"
        arg '-mixin.config=citadel.mixins.json'
        arg '-mixin.config=domesticationinnovation.mixins.json'
        mods { domesticationinnovation { source sourceSets.main } }
    } }
} }
