// Run with both this script and tamePerformanceRegression.init.gradle.
allprojects {
    afterEvaluate {
        def modsDir = project.findProperty('hunterBeltModsDir')
        if (!modsDir) throw new GradleException('Set -PhunterBeltModsDir to the directory containing Relics and its dependencies.')
        def testDependencies = project.fileTree(modsDir) {
            include 'relics-1.20.1-0.8.0.11.jar'
            include 'curios-forge-5.14.1+1.20.1.jar'
            include 'OctoLib-FORGE-0.5.0.1+1.20.1.jar'
            include 'architectury-9.2.14-forge.jar'
        }.files
        if (testDependencies.size() != 4) throw new GradleException('Expected the four Hunter Belt test dependency JARs.')
        repositories.flatDir { dirs modsDir }
        testDependencies.each { jar ->
            // FlatDir resolves the filename without bundling the dependency in our release.
            dependencies.add('implementation', fg.deobf("hunterbelt-test:${jar.name.substring(0, jar.name.length() - 4)}:local"))
        }
        sourceSets.main.java.srcDir('src/test/hunterbelt/java')
    }
}
