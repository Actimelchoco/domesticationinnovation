allprojects {
    afterEvaluate {
        def modsDir = project.file(project.findProperty('claimedIceModsDir'))
        repositories.flatDir { dirs project.file('build/claimed-fire'), modsDir }
        ['ftb-chunks-forge-2001.3.8-no-claimed-fire', 'ftb-library-forge-2001.2.13', 'ftb-teams-forge-2001.3.2',
         'architectury-9.2.14-forge', 'mythsandlegends-0.0.8.8', 'geckolib-forge-1.20.1-4.8.4', 'curios-forge-5.14.1+1.20.1'].each {
            dependencies.add('implementation', fg.deobf("claim-ice-test:${it}:v1"))
        }
        sourceSets.main.java.srcDir('src/test/claimedfire/java')
        sourceSets.main.java.srcDir('src/test/claimedice/java')
        sourceSets.main.resources.srcDir('src/test/claimedfire/resources')
        minecraft.runs { gameTestServer {
            workingDirectory project.file('build/claimed-ice-gametest')
            property 'forge.enabledGameTestNamespaces', 'domesticationinnovation'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            arg '-mixin.config=citadel.mixins.json'
            arg '-mixin.config=domesticationinnovation.mixins.json'
            arg '-mixin.config=ftbchunks-claim-fire.mixins.json'
            arg '-mixin.config=ftbchunks-claim-ice.mixins.json'
            mods { domesticationinnovation { source sourceSets.main } }
        } }
    }
}
