gradle.projectsEvaluated {
    def p = rootProject
    p.sourceSets.test.java.srcDir(p.file('tools/primitive_tests/java'))
    p.sourceSets.test.resources.srcDir(p.file('tools/primitive_tests/resources'))
    p.tasks.register('primitiveCompatTestJar', Jar) {
        dependsOn p.tasks.named('testClasses')
        archiveFileName = 'primitive-compat-tests.jar'
        from p.sourceSets.test.output
    }
    p.reobf.create('primitiveCompatTestJar')
}
