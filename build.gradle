buildscript {
    repositories {        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }

    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle'
repositories{
    maven {
        name = "CurseForge"
        url = "https://minecraft.curseforge.com/api/maven/"
    }
    maven {
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.k-4u.nl"
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'org.spongepowered.mixin'

version = '1.7.1-1.20.1'
group = 'com.github.alexthe668' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'domesticationinnovation-tameslevel-extension-88'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            arg "-mixin.config="+"citadel.mixins.json"
            arg "-mixin.config="+"domesticationinnovation.mixins.json"

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            mods {
                domesticationinnovation {
                    source sourceSets.main
                }
            }
        }

        server {
            properties 'mixin.env.remapRefMap': 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            workingDirectory project.file('run')
            arg "-mixin.config="+"citadel.mixins.json"
            arg "-mixin.config="+"domesticationinnovation.mixins.json"


            property 'forge.logging.console.level', 'debug'

            mods {
                domesticationinnovation {
                    source sourceSets.main
                }
            }
        }

        data {
            properties 'mixin.env.remapRefMap': 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            workingDirectory project.file('run')
            arg "-mixin.config="+"citadel.mixins.json"
            arg "-mixin.config="+"domesticationinnovation.mixins.json"


            property 'forge.logging.console.level', 'debug'

            mods {
                domesticationinnovation {
                    source sourceSets.main
                }
            }
        }
    }
}
// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.register('cleanIncompatibleRunMods', Delete) {
    delete fileTree("$projectDir/run/mods") {
        include 'legendarymonsters-*.jar'
        include 'crittersandcompanions-*.jar'
        include 'MutantMonsters-*.jar'
        include 'mutantmonsters-*.jar'
        include 'PuzzlesLib-*.jar'
        include 'puzzleslib-*.jar'
    }
}

tasks.register('syncOtherJarsToRunMods', Sync) {
    dependsOn(tasks.named('cleanIncompatibleRunMods'))
    from('otherjars') {
        include '**/*.jar'
        exclude 'old/**'
        // Exclude jars that are not compatible with this Forge userdev run profile.
        exclude { details ->
            String lowered = details.name.toLowerCase()
            return lowered.startsWith('legendarymonsters-')
                    || lowered.startsWith('crittersandcompanions-')
                    || lowered.startsWith('mutantmonsters-')
                    || lowered.startsWith('puzzleslib-')
        }
    }
    into file("$projectDir/run/mods")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn(tasks.named('syncOtherJarsToRunMods'))
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation fg.deobf("curse.maven:citadel-331936:4848887")
    def localWaystonesJar = fileTree('C:/Users/bruns/Documents/linggango server/mods') {
        include 'waystones-forge-1.20.1-*.jar'
    }.singleFile
    def localBalmJar = fileTree('C:/Users/bruns/Documents/linggango server/mods') {
        include 'balm-forge-1.20.1-*-all.jar'
    }.singleFile
    if (localWaystonesJar.exists()) {
        compileOnly files(localWaystonesJar)
    }
    if (localBalmJar.exists()) {
        compileOnly files(localBalmJar)
    }

}

mixin {
    add sourceSets.main, "citadel.refmap.json"
    add sourceSets.main, "domesticationinnovation.refmap.json"
    config 'citadel.mixins.json'
    config 'domesticationinnovation.mixins.json'
}
// Example for how to get properties into the manifest for reading by the runtime..
jar {
    manifest {
        attributes([
            "Specification-Title": "domesticationinnovation",
            "Specification-Vendor": "alexthe668",
            "Specification-Version": "1.0", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"alexthe668",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
apply plugin: 'org.spongepowered.mixin'

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

mixin {
    add sourceSets.main, "domesticationinnovation.refmap.json"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
